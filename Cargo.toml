[package]
name = "violin"
version = "0.1.8"
edition = "2024"
license = "MIT"
description = "An opinionated, lightweight Spotify TUI for Linux"
repository = "https://github.com/tiagoyuzoyoshida/violin"
homepage = "https://github.com/tiagoyuzoyoshida/violin"
readme = "README.md"

[dependencies]
base64 = "0.23"
crossterm = "0.29"
directories = "6"
flate2 = "1"
futures-util = "0.3"
http = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = "0.8"
protobuf = "3"
rand = "0.10"
ratatui = "0.30"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.28"
toml = "1"
